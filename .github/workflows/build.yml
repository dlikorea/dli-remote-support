name: Build Windows installer

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Check relay JavaScript
        shell: pwsh
        run: |
          node --check server.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --check public/app.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --test store/download.test.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build from public source and public verification key
        shell: pwsh
        run: |
          .\Build-Installer.ps1 -Version 1.2.0.0 `
            -Server https://remote.dlicompany.com/ `
            -UpdatePublicKeyPath .\release\update-public-key.json `
            -OutDir .\dist
      - name: Record artifact hash
        shell: pwsh
        run: |
          $artifact = Get-Item -LiteralPath .\dist\DLI-RemoteSupport-Setup.exe
          $digest = (Get-FileHash -LiteralPath $artifact.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          "$digest  $($artifact.Name)" | Set-Content -LiteralPath .\dist\SHA256SUMS.txt -Encoding utf8
      - name: Build and inspect Store validation package
        shell: pwsh
        run: |
          $sdk = Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\bin' -Directory |
            Where-Object { $_.Name -match '^\d+\.\d+\.\d+\.\d+$' } |
            Sort-Object { [version]$_.Name } -Descending |
            Where-Object { Test-Path (Join-Path $_.FullName 'x64\makeappx.exe') } |
            Select-Object -First 1
          if (-not $sdk) { throw 'Windows SDK MakeAppx not found.' }
          .\Build-Msix.ps1 -Version 1.3.1.0 -Server https://remote.dlicompany.com/ `
            -MakeAppx (Join-Path $sdk.FullName 'x64\makeappx.exe') `
            -OutDir .\dist\msix-validation -ValidationBuild
          .\store\Test-Msix.ps1 -Package .\dist\msix-validation\DLI-RemoteSupport-1.3.1.0-validation-x64.msix
          .\Build-Msix.ps1 -Version 1.3.1.0 -Server https://remote.dlicompany.com/ `
            -MakeAppx (Join-Path $sdk.FullName 'x64\makeappx.exe') `
            -OutDir .\dist\msix-submission -IdentityPath .\store\identity.json
          .\store\Test-Msix.ps1 -Package .\dist\msix-submission\DLI-RemoteSupport-1.3.1.0-x64.msix
      - name: Upload Store validation package
        uses: actions/upload-artifact@v4
        with:
          name: dli-remote-support-msix-validation-only
          path: dist/msix-validation/
          if-no-files-found: error
      - name: Upload unsigned Store submission package
        uses: actions/upload-artifact@v4
        with:
          name: dli-remote-support-msix-submission-unsigned
          path: dist/msix-submission/
          if-no-files-found: error
      - name: Upload unsigned build for review
        uses: actions/upload-artifact@v4
        with:
          name: dli-remote-support-unsigned
          path: |
            dist/DLI-RemoteSupport-Setup.exe
            dist/SHA256SUMS.txt
          if-no-files-found: error
