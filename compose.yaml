services:
  relay:
    image: node:24-bookworm-slim
    network_mode: host
    user: node
    working_dir: /srv/dli
    command: ["node", "server.js"]
    init: true
    restart: unless-stopped
    read_only: true
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    env_file: ["./relay.env"]
    environment:
      DLI_BIND: 127.0.0.1
      DLI_PORT: "8765"
      DLI_UPDATE_DIR: /srv/dli/feed
    volumes:
      - ./server.js:/srv/dli/server.js:ro
      - ./public:/srv/dli/public:ro
      - ./feed:/srv/dli/feed:ro
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8765/healthz').then(r => { if (!r.ok) process.exitCode = 1; }).catch(() => { process.exitCode = 1; })"]
      interval: 30s
      timeout: 4s
      retries: 3
      start_period: 5s
